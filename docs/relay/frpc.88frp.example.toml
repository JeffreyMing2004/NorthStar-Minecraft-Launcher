# Use the configuration generated by YOUR 88frp account.
# Every placeholder below must be replaced by the platform-provided value.
# Never commit your actual configuration or share the user identifier with players.
serverAddr = "REPLACE_WITH_88FRP_NODE"
serverPort = 7000 # Replace with the node port shown by 88frp.
user = "REPLACE_WITH_88FRP_USER"
loginFailExit = false
transport.heartbeatInterval = 10
transport.heartbeatTimeout = 60

[[proxies]]
name = "REPLACE_WITH_ASSIGNED_PROXY_NAME"
type = "tcp"
localIP = "127.0.0.1"
# Map the TLS reverse proxy, never the raw HTTP gateway or a Minecraft game port.
localPort = 18443
remotePort = 12345 # Replace with the remote port assigned by 88frp.
transport.useEncryption = true
transport.useCompression = true
