# Replace the domain and certificate paths. Do not log Authorization headers.
# Keep this TLS listener on loopback; 88frp forwards to this port.
server {
    listen 127.0.0.1:18443 ssl;
    server_name relay.example.com;
    ssl_certificate /absolute/path/to/fullchain.pem;
    ssl_certificate_key /absolute/path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /v1/ {
        proxy_pass http://127.0.0.1:17630;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location / {
        return 404;
    }
}
