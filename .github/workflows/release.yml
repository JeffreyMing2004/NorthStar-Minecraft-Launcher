name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check, test and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --bin nscl --bin nscl-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package portable launcher
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (!$version) { throw 'Cargo version must be a stable semantic version.' }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$version") {
            throw 'Release tag does not match Cargo.toml.'
          }
          New-Item -ItemType Directory -Path dist/portable -Force | Out-Null
          Copy-Item -LiteralPath target/release/nscl.exe -Destination dist/portable/NSCL.exe
          Copy-Item -LiteralPath target/release/nscl-cli.exe -Destination dist/portable/nscl-cli.exe
          $archive = "nscl-v$version-windows-x86_64.zip"
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'), "$hash  $archive`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nscl-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter *.zip).FullName
          gh release create $env:RELEASE_TAG $archive dist/SHA256SUMS --verify-tag --generate-notes --title "NSCL $env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
