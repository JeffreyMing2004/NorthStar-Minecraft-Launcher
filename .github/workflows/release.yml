name: Windows test release

on:
  push:
    tags: ['v*-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check, test and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package debug test build
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:RELEASE_REF_TYPE -eq 'tag') { $env:RELEASE_REF_NAME } else { '' }
          ./scripts/Package-TestRelease.ps1 -Tag $tag
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nscl-windows-x86_64-debug
          path: |
            target/test-release/*.zip
            target/test-release/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged prerelease
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = (Get-ChildItem -LiteralPath target/test-release -Filter *.zip).FullName
          $notes = 'docs/releases/' + $env:RELEASE_TAG.Substring(1) + '.md'
          gh release create $env:RELEASE_TAG $archive target/test-release/SHA256SUMS --verify-tag --prerelease --latest=false --notes-file $notes --title "NSCL $env:RELEASE_TAG (Debug Test)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
