# CNB -> GitHub 自动同步
# 依赖官方插件 tencentcom/git-sync：https://cnb.cool/cnb/plugins/tencentcom/git-sync
#
# 凭据来源（二选一，见 docs/github-sync.md）：
#   1. 密钥仓库文件（推荐）：把文件地址填进下面每个 pipeline 的 CNB_SECRETS_IMPORTS
#   2. 仓库「设置 → 环境变量」：GITHUB_USERNAME / GITHUB_TOKEN 直接生效
# 需要注意：imports 指向不存在的文件会直接报错，没有密钥仓库时请先留空。
#
# 密钥仓库文件的内容照抄 docs/ci/github.yml，四条 allow_* 缺一不可：
#   allow_slugs / allow_branches / allow_events / allow_images
# 特别是 allow_images: tencentcom/git-sync —— 文件被第三方镜像任务引用，不写会被拒。
$:
  # 推送即同步：覆盖所有分支的 push
  push:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-to-github
      env:
        # 密钥仓库文件地址，例如 https://cnb.cool/JeffreyMing/ci-credentials/-/blob/main/github.yml
        CNB_SECRETS_IMPORTS: 'https://cnb.cool/JeffreyMing/ci-github/-/blob/main/github.yml'
        GITHUB_SYNC_URL: https://github.com/JeffreyMing2004/NorthStar-Minecraft-Launcher.git
      stages:
        - name: push 当前分支到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            # 指定分支时只推这一个分支，不加则推全部远端跟踪分支
            branch: $CNB_BRANCH
            force: false

  # 页面手动触发（见 .cnb/web_trigger.yml），用于补推历史或全量分支
  web_trigger_sync:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-to-github-manual
      env:
        CNB_SECRETS_IMPORTS: 'https://cnb.cool/JeffreyMing/ci-github/-/blob/main/github.yml'
        GITHUB_SYNC_URL: https://github.com/JeffreyMing2004/NorthStar-Minecraft-Launcher.git
      stages:
        - name: 全量同步分支与标签到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            force: false
            push_tags: true

  # Tag 推送时一并同步标签
  tag_push:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-tags-to-github
      env:
        CNB_SECRETS_IMPORTS: 'https://cnb.cool/JeffreyMing/ci-github/-/blob/main/github.yml'
        GITHUB_SYNC_URL: https://github.com/JeffreyMing2004/NorthStar-Minecraft-Launcher.git
      stages:
        - name: 推送标签到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            push_tags: true

  # 贡献者名单自动更新
  # 定时任务在 master 上重新生成 README「贡献者」区块与 CONTRIBUTORS.md，
  # 有新贡献者时以一条 docs 提交推回 master，push 流水线随即同步到 GitHub。
  # .cnb.yml 变更会触发平台重新同步定时任务；列表若丢失，可在
  # 云原生构建 → 定时任务 → 选择 master → 点「同步」恢复。
  # 想立刻刷新：代码 → master 分支详情页 → 运行流水线 → 更新贡献者。
  "crontab: 0 4 * * *":
    - name: update-contributors
      # 每天 4 点重新生成一次；名单没变时不产生提交
      env:
        CONTRIBUTOR_PROFILE_BASE: https://github.com
      stages:
        - name: 安装 git 并补全提交历史
          script:
            # 定时任务的构建环境是精简镜像，git 需自行安装；浅克隆要补齐才能统计全部历史
            - if ! command -v git >/dev/null 2>&1; then apk add --no-cache git; fi
            - if [ -f "$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow --tags || true; fi

        - name: 重新生成贡献者名单
          script: bash scripts/update-contributors.sh

        - name: 提交变更
          script:
            - bash scripts/update-contributors.sh --check
            # 直接改内容再比字节，避免脚本重写文件带来的无意义 diff
            - if git diff --quiet -- README.md CONTRIBUTORS.md; then echo "名单未变化，跳过提交"; exit 0; fi
            - git config user.name "${GIT_AUTHOR_NAME:-CodeBuddy}"
            - git config user.email "${GIT_AUTHOR_EMAIL:-codebuddy@cnb.cool}"
            - git add README.md CONTRIBUTORS.md
            - git commit -m "docs: 更新贡献者名单"
            - git push origin "HEAD:${CNB_BRANCH}"

  # 手动触发入口，.cnb/web_trigger.yml 的按钮指向这里
  web_trigger_contributors:
    - name: update-contributors
      env:
        CONTRIBUTOR_PROFILE_BASE: https://github.com
      stages:
        - name: 安装 git 并补全提交历史
          script:
            - if ! command -v git >/dev/null 2>&1; then apk add --no-cache git; fi
            - if [ -f "$(git rev-parse --git-dir)/shallow" ]; then git fetch --unshallow --tags || true; fi
        - name: 重新生成贡献者名单
          script: bash scripts/update-contributors.sh
        - name: 提交变更
          script:
            - bash scripts/update-contributors.sh --check
            - if git diff --quiet -- README.md CONTRIBUTORS.md; then echo "名单未变化，跳过提交"; exit 0; fi
            - git config user.name "${GIT_AUTHOR_NAME:-CodeBuddy}"
            - git config user.email "${GIT_AUTHOR_EMAIL:-codebuddy@cnb.cool}"
            - git add README.md CONTRIBUTORS.md
            - git commit -m "docs: 更新贡献者名单"
            - git push origin "HEAD:${CNB_BRANCH}"
