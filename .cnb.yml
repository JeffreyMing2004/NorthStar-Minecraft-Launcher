# CNB -> GitHub 自动同步
# 依赖官方插件 tencentcom/git-sync：https://cnb.cool/cnb/plugins/tencentcom/git-sync
#
# 凭据来源（二选一，见 docs/github-sync.md）：
#   1. 密钥仓库文件（推荐）：把文件地址填进下面每个 pipeline 的 CNB_SECRETS_IMPORTS
#   2. 仓库「设置 → 环境变量」：GITHUB_USERNAME / GITHUB_TOKEN 直接生效
# 需要注意：imports 指向不存在的文件会直接报错，没有密钥仓库时请先留空。
#
# 密钥仓库里的文件建议带上 allow_* 规则，否则只有密钥仓库管理员/负责人触发的流水线能引用：
#   allow_slugs: JeffreyMing/NorthStar-Minecraft-Launcher
#   allow_branches: "**"
#   allow_events: "push,tag_push,web_trigger_sync"
$:
  # 推送即同步：覆盖所有分支的 push
  push:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-to-github
      env:
        # 密钥仓库文件地址，例如 https://cnb.cool/JeffreyMing/ci-secrets/-/blob/main/github.yml
        CNB_SECRETS_IMPORTS: ''
        GITHUB_SYNC_URL: https://github.com/JeffreyMing/NorthStar-Minecraft-Launcher.git
      stages:
        - name: push 当前分支到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            # 指定分支时只推这一个分支，不加则推全部远端跟踪分支
            branch: $CNB_BRANCH
            force: true

  # 页面手动触发（见 .cnb/web_trigger.yml），用于补推历史或全量分支
  web_trigger_sync:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-to-github-manual
      env:
        CNB_SECRETS_IMPORTS: ''
        GITHUB_SYNC_URL: https://github.com/JeffreyMing/NorthStar-Minecraft-Launcher.git
      stages:
        - name: 全量同步分支与标签到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            force: true
            push_tags: true

  # Tag 推送时一并同步标签
  tag_push:
    - imports:
        - ${CNB_SECRETS_IMPORTS}
      name: sync-tags-to-github
      env:
        CNB_SECRETS_IMPORTS: ''
        GITHUB_SYNC_URL: https://github.com/JeffreyMing/NorthStar-Minecraft-Launcher.git
      stages:
        - name: 推送标签到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: $GITHUB_SYNC_URL
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            push_tags: true
