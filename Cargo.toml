[package]
name = "nscl"
version = "0.1.0"
edition = "2024"
default-run = "nscl"

[dependencies]
eframe = "0.37.0"
egui = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
sha1 = "0.10"
md5 = "0.8"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
