[package]
name = "nscl"
version = "0.1.0"
edition = "2024"
default-run = "nscl"

[dependencies]
eframe = "0.37.0"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "native-tls", "system-proxy"] }
sha1 = "0.10"
md5 = "0.8"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
webbrowser = { version = "1", features = ["hardened"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
quick-xml = { version = "0.41", features = ["serialize"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
