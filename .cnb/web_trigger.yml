branch:
  - buttons:
      - name: 同步到 GitHub
        description: 全量推送所有分支与标签（push 之外的兜底手段）
        event: web_trigger_sync
        groupName: 同步
        permissions:
          roles:
            - owner
            - master
      - name: 更新贡献者
        description: 从 git 历史重建 README 与 CONTRIBUTORS.md 的贡献者名单，有变化会提交
        event: web_trigger_contributors
        groupName: 同步
        permissions:
          roles:
            - owner
            - master
